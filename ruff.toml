# === pyproject-tmpl: managed file (do not edit; overwritten by `make update-pyproject`) ===
line-length = 100

[lint]
select = ["E", "W", "F", "B", "N", "PL"]
ignore = ["PLR2004"]

[lint.pylint]
max-args = 10
max-positional-args = 10
max-branches = 25
max-statements = 100

[lint.per-file-ignores]
"SHORTNAME/__init__.py" = ["N999"]
